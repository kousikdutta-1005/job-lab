<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>job-lab</title>
    <meta name="description" content="A private career desk: live design roles, contacts, applications and pay, rebuilt nightly." />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfcfc" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230a0a0b'/><circle cx='16' cy='16' r='6' fill='%234f46e5'/></svg>" />
  <script>
      // Runs before first paint so a stored preference never flashes the
      // other scale. Mirrors src/lib/theme.ts.
      try {
        var t = localStorage.getItem("joblab.theme") || "dark"
        if (t === "system")
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
        document.documentElement.setAttribute("data-theme", t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
