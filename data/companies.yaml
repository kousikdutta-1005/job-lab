# The seed list. Everything else in the crawl is derived from it.
#
# Only `name` is required. `domain` improves the email-pattern guess and the
# LinkedIn company link; `ats` and `slug` skip auto-detection when known. If both
# are omitted the pipeline probes the public board endpoints of every supported
# ATS and caches whichever one answers, so adding a company is usually one line.
#
# Tags are free-form and only used for grouping in the board UI.

